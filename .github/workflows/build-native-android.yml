name: Build Native Android Library

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      abi:
        description: 'Target ABI'
        required: false
        default: 'arm64-v8a'
        type: choice
        options:
          - armeabi-v7a
          - arm64-v8a
          - x86_64

jobs:
  build-native:
    name: Build Native (${{ github.event.inputs.abi }}, ${{ github.event.inputs.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Android SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip
          ANDROID_SDK_ROOT=/usr/local/android-sdk
          sudo mkdir -p $ANDROID_SDK_ROOT
          cd $ANDROID_SDK_ROOT
          sudo wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          sudo unzip -q cmdline-tools.zip -d cmdline-tools
          sudo mv cmdline-tools/cmdline-tools cmdline-tools/latest
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | sudo cmdline-tools/latest/bin/sdkmanager --licenses
          sudo cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
      
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            example/android/app/.cxx
            android/src/main/cpp/build
          key: cmake-${{ runner.os }}-${{ github.event.inputs.abi }}-${{ github.event.inputs.build_type }}-${{ hashFiles('**/CMakeLists.txt', '**/build.gradle*') }}
          restore-keys: |
            cmake-${{ runner.os }}-${{ github.event.inputs.abi }}-${{ github.event.inputs.build_type }}-
      
      - name: Configure CMake (Android library)
        working-directory: android/src/main/cpp
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ github.event.inputs.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMINIAUDIODART_ENABLE_CURL=OFF \
            -B build/${{ github.event.inputs.abi }} \
            -S .
      
      - name: Build native library
        working-directory: android/src/main/cpp
        run: |
          cmake --build build/${{ github.event.inputs.abi }} --target audio_engine --config Debug -j$(nproc)
      
      - name: Find built libraries
        working-directory: android/src/main/cpp
        run: |
          find build -name "libsautiflow.so" -o -name "libaudio_engine.so" | head -20
          ls -la build/${{ github.event.inputs.abi }}/
      
      - name: Copy libraries to artifact directory
        working-directory: android/src/main/cpp
        run: |
          mkdir -p ../../../../build-artifacts/${{ github.event.inputs.abi }}/${{ github.event.inputs.build_type }}
          find build -name "libsautiflow.so" -exec cp {} ../../../../build-artifacts/${{ github.event.inputs.abi }}/${{ github.event.inputs.build_type }}/ \;
          find build -name "libaudio_engine.so" -exec cp {} ../../../../build-artifacts/${{ github.event.inputs.abi }}/${{ github.event.inputs.build_type }}/ \;
          # Also copy FFmpeg dependencies
          find build -name "libav*.so" -exec cp {} ../../../../build-artifacts/${{ github.event.inputs.abi }}/${{ github.event.inputs.build_type }}/ \;
          find build -name "libswresample.so" -exec cp {} ../../../../build-artifacts/${{ github.event.inputs.abi }}/${{ github.event.inputs.build_type }}/ \;
          ls -la ../../../../build-artifacts/${{ github.event.inputs.abi }}/${{ github.event.inputs.build_type }}/
      
      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-${{ github.event.inputs.abi }}-${{ github.event.inputs.build_type }}
          path: build-artifacts/${{ github.event.inputs.abi }}/${{ github.event.inputs.build_type }}/
          retention-days: 7

  build-full-apk:
    name: Build Full Flutter APK (${{ github.event.inputs.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-native
    if: github.event.inputs.build_type == 'Release'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      
      - name: Install dependencies
        working-directory: ./sautiplay
        run: flutter pub get
      
      - name: Generate Splash & Launcher Icons
        working-directory: ./sautiplay
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      
      - name: Build Flutter APK
        working-directory: ./sautiplay
        run: |
          flutter build apk --release \
            --target-platform android-${{ github.event.inputs.abi == 'armeabi-v7a' && 'arm' || 'arm64' }} \
            --split-per-abi \
            --no-pub
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.abi }}-${{ github.event.inputs.build_type }}
          path: sautiplay/build/app/outputs/flutter-apk/
          retention-days: 7